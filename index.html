<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jurassic Park - Giant T-Rex</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; overflow: hidden; background: #050a05; font-family: 'Segoe UI', sans-serif; color: white; touch-action: none; }
canvas { display: block; }
#hud { position: fixed; top: 20px; left: 20px; z-index: 5; background: rgba(0,0,0,.7); padding: 15px 20px; border-radius: 8px; pointer-events: none; border-left: 4px solid #ff2200; }
#hud h2 { margin: 0 0 5px; font-size: 22px; letter-spacing: 3px; color: #ffd7aa; font-weight: bold;}
#hud p { margin: 0; color: #ff6666; font-size: 13px; letter-spacing: 2px; font-weight: bold;}
#crosshair { position: fixed; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.7); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
#joystick { position: fixed; bottom: 40px; left: 40px; width: 140px; height: 140px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); background: rgba(0,0,0,.5); z-index: 10; touch-action: none; }
#stick { position: absolute; width: 60px; height: 60px; left: 40px; top: 40px; border-radius: 50%; background: rgba(200,220,200,.5); border: 2px solid rgba(255,255,255,.5); }
#start { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,.95); }
#start h1 { font-size: 36px; letter-spacing: 8px; margin-bottom: 10px; color: #ff4400; }
#start p { color: #88aa88; margin-bottom: 40px; letter-spacing: 3px; }
#start button { padding: 20px 50px; background: #2a3b2a; color: white; border: 2px solid #6b8a58; border-radius: 4px; font-size: 20px; cursor: pointer; letter-spacing: 4px; font-weight: bold; }
#loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffaa55; font-size: 18px; z-index: 15; display: none; text-align: center; }
</style>
</head>
<body>

<div id="hud">
  <h2>ISLA SORNA</h2>
  <p>DANGER: T-REX ACTIVE</p>
</div>
<div id="crosshair"></div>
<div id="joystick"><div id="stick"></div></div>
<div id="loading">Downloading T-Rex Model...</div>
<div id="start">
  <h1>JURASSIC PARK</h1>
  <p>MOVIE EDITION</p>
  <button id="startButton">ENTER THE JUNGLE</button>
</div>

<audio id="roarSound" src="https://actions.google.com/sounds/v1/animals/trex_roar.ogg" preload="auto"></audio>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// --- WORLD SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2b1a);
scene.fog = new THREE.FogExp2(0x1a2b1a, 0.02);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// --- LIGHTING ---
const ambient = new THREE.HemisphereLight(0x88aacc, 0x223311, 1.5); 
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffcc88, 3.0);
sun.position.set(-50, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -100; sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100; sun.shadow.camera.bottom = -100;
scene.add(sun);

// --- TERRAIN ---
function getTerrainHeight(x, z) {
  return Math.sin(x * 0.02) * Math.cos(z * 0.02) * 10 + Math.sin(x * 0.05) * Math.cos(z * 0.05) * 2;
}
const groundGeo = new THREE.PlaneGeometry(600, 600, 128, 128);
groundGeo.rotateX(-Math.PI / 2);
const pos = groundGeo.attributes.position;
for (let i = 0; i < pos.count; i++) pos.setY(i, getTerrainHeight(pos.getX(i), pos.getZ(i)));
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x1f2a18, roughness: 1 }));
ground.receiveShadow = true;
scene.add(ground);

// --- REALISTIC TREES ---
function createBarkTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#3b2b1a'; ctx.fillRect(0, 0, 256, 256);
  for(let i=0; i<1500; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? '#1f140b' : '#4a3622';
    ctx.fillRect(Math.random()*256, Math.random()*256, Math.random()*5+1, Math.random()*20+5);
  }
  return new THREE.CanvasTexture(canvas);
}
const barkTex = createBarkTexture();
barkTex.wrapS = THREE.RepeatWrapping; barkTex.wrapT = THREE.RepeatWrapping; barkTex.repeat.set(2, 4);
const barkMat = new THREE.MeshStandardMaterial({ map: barkTex, roughness: 1 });
const leafMats = [
  new THREE.MeshStandardMaterial({ color: 0x0a1f0a, roughness: 0.9, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x143614, roughness: 0.9, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x1f4a1f, roughness: 0.9, flatShading: true })
];

function makeRealisticTree(x, z) {
  const tree = new THREE.Group();
  const h = 25 + Math.random() * 20;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 3.5, h, 8), barkMat);
  trunk.position.y = h / 2; trunk.castShadow = true; trunk.receiveShadow = true;
  tree.add(trunk);
  for (let i = 0; i < 15; i++) {
    const leaf = new THREE.Mesh(new THREE.DodecahedronGeometry(4 + Math.random() * 4, 0), leafMats[Math.floor(Math.random() * leafMats.length)]);
    leaf.position.set((Math.random() - 0.5) * 12, h + (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 12);
    leaf.rotation.set(Math.random(), Math.random(), Math.random());
    leaf.castShadow = true; leaf.receiveShadow = true;
    tree.add(leaf);
  }
  tree.position.set(x, getTerrainHeight(x, z), z);
  scene.add(tree);
}

for (let i = 0; i < 70; i++) {
  const x = (Math.random() - 0.5) * 300;
  const z = (Math.random() - 0.5) * 300;
  if (Math.abs(x) > 25 || Math.abs(z) > 25) makeRealisticTree(x, z);
}

// ==========================================
// --- YOUR DOWNLOADED T-REX MODEL ---
// ==========================================
let tRexMixer = null;
let tRexModel = null;
let tRexGroup = new THREE.Group(); // Create a group to handle movement cleanly
scene.add(tRexGroup);

const loader = new GLTFLoader();
const loadingDiv = document.getElementById("loading");

const MODEL_URL = './niknet_art-tyrannosaurus-3232.glb';

function loadTRex() {
  loadingDiv.style.display = "block";
  loadingDiv.innerText = "Loading Your T-Rex...";
  
  loader.load(MODEL_URL, (gltf) => {
    tRexModel = gltf.scene;
    
    // 1. MAKE IT GIANT
    tRexModel.scale.set(3.0, 3.0, 3.0); 
    
    // 2. STOP IT FROM SINKING (Calculate exact height)
    const box = new THREE.Box3().setFromObject(tRexModel);
    const center = box.getCenter(new THREE.Vector3());
    
    // Shift the model so its lowest point is exactly at the ground (y=0) and center it horizontally
    tRexModel.position.y -= box.min.y; 
    tRexModel.position.x -= center.x; 
    tRexModel.position.z -= center.z;
    
    // Add model to the movement group
    tRexGroup.add(tRexModel);
    
    // Start it at a specific location
    tRexGroup.position.set(0, getTerrainHeight(0, -25), -25);
    
    tRexModel.traverse((child) => { 
      if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } 
    });
    
    loadingDiv.style.display = "none";

    // Play animation
    tRexMixer = new THREE.AnimationMixer(tRexModel);
    if (gltf.animations.length > 0) {
      tRexMixer.clipAction(gltf.animations[0]).play();
    }
  }, 
  (xhr) => {
    if(xhr.total) loadingDiv.innerText = `Loading: ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
  },
  (error) => {
    loadingDiv.innerText = "File not found! Check GitHub upload.";
    loadingDiv.style.color = "red";
  });
}
loadTRex();

// --- CONTROLS ---
let yaw = 0, pitch = 0, joyX = 0, joyY = 0;
const keys = {};
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
let joyActive = false;
joystick.addEventListener("pointerdown", e => { joyActive = true; joystick.setPointerCapture(e.pointerId); updateJoy(e); });
joystick.addEventListener("pointermove", e => { if (joyActive) updateJoy(e); });
function updateJoy(e) {
  const rect = joystick.getBoundingClientRect();
  let dx = e.clientX - rect.left - rect.width / 2;
  let dy = e.clientY - rect.top - rect.height / 2;
  const max = 40, len = Math.hypot(dx, dy);
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  joyX = dx / max; joyY = dy / max;
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
}
function releaseJoy() { joyActive = false; joyX = 0; joyY = 0; stick.style.transform = "translate(0px, 0px)"; }
joystick.addEventListener("pointerup", releaseJoy);
joystick.addEventListener("pointercancel", releaseJoy);

let lookActive = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener("pointerdown", e => { lookActive = true; lastX = e.clientX; lastY = e.clientY; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener("pointermove", e => {
  if (!lookActive) return;
  yaw -= (e.clientX - lastX) * 0.004;
  pitch -= (e.clientY - lastY) * 0.004;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
  lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener("pointerup", () => lookActive = false);
renderer.domElement.addEventListener("pointercancel", () => lookActive = false);

// --- AUDIO ---
const roarAudio = document.getElementById("roarSound");

document.getElementById("startButton").onclick = () => {
  document.getElementById("start").style.display = "none";
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  
  roarAudio.volume = 1.0;
  roarAudio.play().catch(e => console.log("Audio blocked by browser"));
  
  setInterval(() => {
    roarAudio.currentTime = 0;
    roarAudio.play().catch(e => {});
  }, 15000);
};

// --- ANIMATION LOOP ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (tRexMixer) tRexMixer.update(delta);
  
  // Perfect Movement Math
  if (tRexModel) {
    const speed = 0.15;
    const radius = 25;
    const angle = t * speed;

    // Move in a circle
    const x = Math.cos(angle) * radius;
    const z = -25 + Math.sin(angle) * radius;

    tRexGroup.position.set(x, getTerrainHeight(x, z), z);

    // Look at the NEXT point on the circle to face forward perfectly
    const nextAngle = angle + 0.1;
    const nextX = Math.cos(nextAngle) * radius;
    const nextZ = -25 + Math.sin(nextAngle) * radius;
    tRexGroup.lookAt(nextX, tRexGroup.position.y, nextZ);
    
    // Note: If the T-Rex is walking backwards, uncomment the line below:
    // tRexGroup.rotateY(Math.PI);
  }

  // Player Movement
  let forward = 0, sideways = 0;
  if (keys["w"] || keys["arrowup"]) forward += 1;
  if (keys["s"] || keys["arrowdown"]) forward -= 1;
  if (keys["a"] || keys["arrowleft"]) sideways -= 1;
  if (keys["d"] || keys["arrowright"]) sideways += 1;
  forward -= joyY; sideways += joyX;

  const movement = new THREE.Vector3(sideways, 0, -forward);
  if (movement.length() > 1) movement.normalize();

  const direction = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const speed = 9;

  camera.position.addScaledVector(direction, movement.z * speed * delta);
  camera.position.addScaledVector(right, movement.x * speed * delta);
  camera.position.y = getTerrainHeight(camera.position.x, camera.position.z) + 1.7;
  
  if (movement.length() > 0) camera.position.y += Math.sin(t * 15) * 0.06;

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
