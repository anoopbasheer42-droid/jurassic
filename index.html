
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Jurassic Explorer 3D</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #101b13;
  font-family: Arial, sans-serif;
  color: white;
  touch-action: none;
}

canvas {
  display: block;
}

#hud {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 5;
  background: rgba(0,0,0,.45);
  padding: 12px 16px;
  border-radius: 12px;
  backdrop-filter: blur(8px);
  pointer-events: none;
}

#hud h2 {
  margin: 0 0 5px;
  font-size: 18px;
}

#hud p {
  margin: 0;
  color: #c5d6b6;
  font-size: 12px;
}

#crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  opacity: .7;
  pointer-events: none;
}

#joystick {
  position: fixed;
  bottom: 30px;
  left: 30px;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.3);
  background: rgba(0,0,0,.25);
  z-index: 10;
  touch-action: none;
}

#stick {
  position: absolute;
  width: 55px;
  height: 55px;
  left: 37px;
  top: 37px;
  border-radius: 50%;
  background: rgba(220,240,210,.6);
  border: 2px solid rgba(255,255,255,.6);
}

#lookHint {
  position: fixed;
  bottom: 25px;
  right: 25px;
  color: white;
  opacity: .65;
  font-size: 13px;
  pointer-events: none;
}

#start {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(5,12,6,.8);
}

#start button {
  padding: 18px 28px;
  background: #526d39;
  color: white;
  border: 1px solid #a2bd80;
  border-radius: 12px;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="hud">
  <h2>JURASSIC EXPLORER</h2>
  <p>PREHISTORIC WILDERNESS</p>
</div>

<div id="crosshair"></div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="lookHint">
  Drag screen to look around
</div>

<div id="start">
  <button id="startButton">ENTER THE JUNGLE</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

// ----------------------------------
// WORLD SETUP
// ----------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9aafa0);
scene.fog = new THREE.FogExp2(0x82947d, 0.008);

const camera = new THREE.PerspectiveCamera(
  72,
  window.innerWidth / window.innerHeight,
  0.1,
  600
);

camera.position.set(0, 1.7, 12);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 1.5)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

document.body.appendChild(renderer.domElement);

// ----------------------------------
// LIGHTING
// ----------------------------------

const ambient = new THREE.HemisphereLight(
  0xc8e2ff,
  0x354021,
  2
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
  0xffe4b0,
  3.0
);

sun.position.set(-30, 60, 25);
sun.castShadow = true;

sun.shadow.mapSize.set(1024, 1024);

sun.shadow.camera.left = -45;
sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45;
sun.shadow.camera.bottom = -45;

scene.add(sun);

// ----------------------------------
// MATERIALS
// ----------------------------------

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x435237,
  roughness: 1
});

const barkMaterial = new THREE.MeshStandardMaterial({
  color: 0x51432b,
  roughness: 1
});

const leafMaterials = [
  new THREE.MeshStandardMaterial({
    color: 0x294a26,
    roughness: 1
  }),
  new THREE.MeshStandardMaterial({
    color: 0x456735,
    roughness: 1
  }),
  new THREE.MeshStandardMaterial({
    color: 0x617b40,
    roughness: 1
  })
];

const rockMaterial = new THREE.MeshStandardMaterial({
  color: 0x575d4c,
  roughness: 1
};

// ----------------------------------
// GROUND
// ----------------------------------

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  groundMaterial
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
ground.receiveShadow = true;

scene.add(ground);

// ----------------------------------
// PREHISTORIC FOREST
// ----------------------------------

const trees = new THREE.Group();
scene.add(trees);

function makeTree(x, z, scale = 1) {

  const tree = new THREE.Group();

  const trunkHeight = 5 + Math.random() * 5;

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.35 * scale,
      0.65 * scale,
      trunkHeight * scale,
      7
    ),
    barkMaterial
  );

  trunk.position.y = trunkHeight * scale / 2;
  trunk.castShadow = true;

  tree.add(trunk);

  // Branches
  for (let i = 0; i < 3; i++) {

    const branch = new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.1 * scale,
        0.22 * scale,
        2.8 * scale,
        6
      ),
      barkMaterial
    );

    branch.position.set(
      (Math.random() - 0.5) * 2 * scale,
      trunkHeight * scale * (0.5 + i * 0.12),
      (Math.random() - 0.5) * 2 * scale
    );

    branch.rotation.z = -0.7;
    tree.add(branch);
  }

  // Tree crown
  for (let i = 0; i < 5; i++) {

    const leaf = new THREE.Mesh(
      new THREE.IcosahedronGeometry(
        (2.2 + Math.random() * 1.6) * scale,
        1
      ),
      leafMaterials[
        Math.floor(Math.random() * leafMaterials.length)
      ]
    );

    leaf.position.set(
      (Math.random() - 0.5) * 4 * scale,
      trunkHeight * scale +
        (Math.random() - 0.5) * 3 * scale,
      (Math.random() - 0.5) * 4 * scale
    );

    leaf.castShadow = true;

    tree.add(leaf);
  }

  tree.position.set(x, 0, z);
  trees.add(tree);
}

// Keep the center open for a walking trail.
for (let i = 0; i < 260; i++) {

  const x = (Math.random() - 0.5) * 180;
  const z = (Math.random() - 0.5) * 180;

  if (Math.abs(x) < 8) continue;

  makeTree(
    x,
    z,
    0.7 + Math.random() * 1.2
  );
}

// ----------------------------------
// FERNS
// ----------------------------------

const fernMaterial = new THREE.MeshStandardMaterial({
  color: 0x426e35,
  side: THREE.DoubleSide,
  roughness: 1
});

for (let i = 0; i < 100; i++) {

  const fern = new THREE.Group();

  for (let j = 0; j < 6; j++) {

    const leaf = new THREE.Mesh(
      new THREE.ConeGeometry(0.12, 2.5, 5),
      fernMaterial
    );

    leaf.position.y = 0.8;
    leaf.rotation.z = -0.8;
    leaf.rotation.y = j * Math.PI / 3;

    fern.add(leaf);
  }

  fern.position.set(
    (Math.random() - 0.5) * 100,
    0,
    (Math.random() - 0.5) * 100
  );

  scene.add(fern);
}

// ----------------------------------
// ROCKS
// ----------------------------------

for (let i = 0; i < 80; i++) {

  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(
      0.5 + Math.random() * 2,
      0
    ),
    rockMaterial
  );

  rock.position.set(
    (Math.random() - 0.5) * 120,
    0.5,
    (Math.random() - 0.5) * 120
  );

  rock.rotation.set(
    Math.random(),
    Math.random() * 3,
    Math.random()
  );

  rock.castShadow = true;
  scene.add(rock);
}

// ----------------------------------
// TEMPORARY DINOSAUR MODEL
// ----------------------------------
// Primitive body parts are placeholders.
// Later we will load a realistic animated GLB.

const dinosaur = new THREE.Group();
scene.add(dinosaur);

const dinosaurMaterial = new THREE.MeshStandardMaterial({
  color: 0x596b40,
  roughness: 0.9
});

const bellyMaterial = new THREE.MeshStandardMaterial({
  color: 0x8b8b60,
  roughness: 1
});

function dinosaurPart(
  geometry,
  material,
  position,
  rotation = [0, 0, 0]
) {

  const mesh = new THREE.Mesh(
    geometry,
    material
  );

  mesh.position.set(...position);
  mesh.rotation.set(...rotation);

  mesh.castShadow = true;

  dinosaur.add(mesh);

  return mesh;
}

// Body
dinosaurPart(
  new THREE.SphereGeometry(1, 16, 12),
  dinosaurMaterial,
  [0, 2.2, 0],
  [0, 0, Math.PI / 2]
).scale.set(1.6, 0.8, 0.8);

// Belly
dinosaurPart(
  new THREE.SphereGeometry(0.75, 12, 8),
  bellyMaterial,
  [0, 1.9, -0.1]
).scale.set(1.3, 0.65, 0.8);

// Neck
dinosaurPart(
  new THREE.CylinderGeometry(0.35, 0.55, 2.5, 10),
  dinosaurMaterial,
  [0, 3.5, -1.1],
  [-0.4, 0, 0]
);

// Head
dinosaurPart(
  new THREE.SphereGeometry(0.65, 12, 10),
  dinosaurMaterial,
  [0, 4.3, -2.1]
);

// Tail
dinosaurPart(
  new THREE.ConeGeometry(0.45, 3.3, 10),
  dinosaurMaterial,
  [0, 2.3, 2],
  [Math.PI / 2, 0, 0]
);

// Legs
const legs = [];

for (const side of [-1, 1]) {

  const leg = dinosaurPart(
    new THREE.CylinderGeometry(
      0.25,
      0.4,
      1.5,
      8
    ),
    dinosaurMaterial,
    [side * 0.55, 0.8, 0.2]
  );

  legs.push(leg);
}

// Position dinosaur ahead of player
dinosaur.position.set(0, 0, -18);

// ----------------------------------
// FIRST-PERSON CONTROLS
// ----------------------------------

let yaw = 0;
let pitch = 0;

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

let joyX = 0;
let joyY = 0;

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joyActive = false;

joystick.addEventListener("pointerdown", e => {
  joyActive = true;
  joystick.setPointerCapture(e.pointerId);
  updateJoystick(e);
});

joystick.addEventListener("pointermove", e => {
  if (joyActive) updateJoystick(e);
});

function updateJoystick(e) {

  const rect = joystick.getBoundingClientRect();

  const centerX = rect.width / 2;
  const centerY = rect.height / 2;

  let dx = e.clientX - rect.left - centerX;
  let dy = e.clientY - rect.top - centerY;

  const max = 38;

  const length = Math.hypot(dx, dy);

  if (length > max) {
    dx = dx / length * max;
    dy = dy / length * max;
  }

  joyX = dx / max;
  joyY = dy / max;

  stick.style.transform =
    `translate(${dx}px, ${dy}px)`;
}

function releaseJoystick() {
  joyActive = false;
  joyX = 0;
  joyY = 0;
  stick.style.transform = "translate(0px, 0px)";
}

joystick.addEventListener("pointerup", releaseJoystick);
joystick.addEventListener("pointercancel", releaseJoystick);

// Drag to look around
let lookActive = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener("pointerdown", e => {

  lookActive = true;
  lastX = e.clientX;
  lastY = e.clientY;

  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener("pointermove", e => {

  if (!lookActive) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;

  yaw -= dx * 0.004;
  pitch -= dy * 0.004;

  pitch = Math.max(
    -1.2,
    Math.min(1.2, pitch)
  );
});

renderer.domElement.addEventListener("pointerup", () => {
  lookActive = false;
});

renderer.domElement.addEventListener("pointercancel", () => {
  lookActive = false;
});

// ----------------------------------
// START EXPERIENCE
// ----------------------------------

document.getElementById("startButton").onclick = () => {

  document.getElementById("start").style.display = "none";

  // Attempt fullscreen on supported devices.
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen()
      .catch(() => {});
  }
};

// ----------------------------------
// ANIMATION LOOP
// ----------------------------------

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  // Movement direction
  let forward = 0;
  let sideways = 0;

  if (keys["w"] || keys["arrowup"]) forward += 1;
  if (keys["s"] || keys["arrowdown"]) forward -= 1;

  if (keys["a"] || keys["arrowleft"]) sideways -= 1;
  if (keys["d"] || keys["arrowright"]) sideways += 1;

  forward -= joyY;
  sideways += joyX;

  const movement = new THREE.Vector3(
    sideways,
    0,
    -forward
  );

  if (movement.length() > 1) {
    movement.normalize();
  }

  // Move relative to camera direction.
  const direction = new THREE.Vector3(
    Math.sin(yaw),
    0,
    Math.cos(yaw)
  );

  const right = new THREE.Vector3(
    Math.cos(yaw),
    0,
    -Math.sin(yaw)
  );

  const speed = 7;

  camera.position.addScaledVector(
    direction,
    movement.z * speed * delta
  );

  camera.position.addScaledVector(
    right,
    movement.x * speed * delta
  );

  camera.position.y = 1.7;

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  // Dinosaur idle movement
  const t = clock.elapsedTime;

  dinosaur.position.x = Math.sin(t * 0.18) * 3;

  dinosaur.rotation.y =
    Math.sin(t * 0.2) * 0.15;

  dinosaur.position.y =
    Math.sin(t * 1.2) * 0.04;

  // Gentle forest movement
  trees.children.forEach((tree, i) => {

    tree.rotation.z =
      Math.sin(t * 0.3 + i) * 0.003;
  });

  renderer.render(scene, camera);
}

animate();

// ----------------------------------
// RESIZE
// ----------------------------------

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

</script>

</body>
</html>
