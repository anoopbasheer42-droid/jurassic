<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jurassic Explorer 3D - Cinematic</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; overflow: hidden; background: #0a0f0a;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: white; touch-action: none;
}
canvas { display: block; }

#hud {
  position: fixed; top: 20px; left: 20px; z-index: 5;
  background: rgba(0,0,0,.6); padding: 15px 20px; border-radius: 8px;
  backdrop-filter: blur(10px); pointer-events: none;
  border-left: 4px solid #ff4400;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
#hud h2 { margin: 0 0 5px; font-size: 20px; letter-spacing: 3px; color: #ffd7aa; font-weight: bold;}
#hud p { margin: 0; color: #88aa88; font-size: 13px; letter-spacing: 1px; }

#crosshair {
  position: fixed; top: 50%; left: 50%; width: 8px; height: 8px;
  background: rgba(255,255,255,0.6); border-radius: 50%;
  pointer-events: none; transform: translate(-50%, -50%);
  box-shadow: 0 0 5px rgba(0,0,0,0.8);
}

#joystick {
  position: fixed; bottom: 40px; left: 40px; width: 140px; height: 140px;
  border-radius: 50%; border: 2px solid rgba(255,255,255,.15);
  background: rgba(0,0,0,.4); z-index: 10; touch-action: none;
  backdrop-filter: blur(2px);
}
#stick {
  position: absolute; width: 60px; height: 60px; left: 40px; top: 40px;
  border-radius: 50%; background: rgba(160,200,150,.4);
  border: 2px solid rgba(255,255,255,.4);
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

#start {
  position: fixed; inset: 0; z-index: 20; display: flex;
  align-items: center; justify-content: center; flex-direction: column;
  background: rgba(5,10,5,.95); backdrop-filter: blur(10px);
}
#start h1 { font-size: 32px; letter-spacing: 5px; margin-bottom: 10px; color: #ffaa55;}
#start p { color: #88aa88; margin-bottom: 30px; letter-spacing: 2px;}
#start button {
  padding: 20px 40px; background: #3d4f33; color: white;
  border: 1px solid #6b8a58; border-radius: 4px; font-size: 18px;
  cursor: pointer; letter-spacing: 3px; text-transform: uppercase;
  transition: 0.3s; box-shadow: 0 0 20px rgba(107, 138, 88, 0.2);
}
#start button:hover { background: #5e754f; box-shadow: 0 0 30px rgba(107, 138, 88, 0.6); }
</style>
</head>
<body>

<div id="hud">
  <h2>ISLA SORNA</h2>
  <p>RESTRICTED AREA</p>
</div>

<div id="crosshair"></div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="start">
  <h1>JURASSIC PARK</h1>
  <p>THE REX IS HUNTING</p>
  <button id="startButton">ENTER THE JUNGLE</button>
</div>

<!-- Audio Elements -->
<audio id="ambientSound" loop>
  <source src="https://www.myinstants.com/media/sounds/jungle-ambience.mp3" type="audio/mpeg">
</audio>
<audio id="roarSound">
  <source src="https://www.myinstants.com/media/sounds/t-rex-roar.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// ----------------------------------
// WORLD SETUP
// ----------------------------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2b1a);
scene.fog = new THREE.FogExp2(0x1a2b1a, 0.025); // Thick jungle fog

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 600);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// ----------------------------------
// LIGHTING
// ----------------------------------

const ambient = new THREE.HemisphereLight(0x4466aa, 0x112211, 1.0);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffaa66, 2.5);
sun.position.set(-40, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
sun.shadow.bias = -0.001;
scene.add(sun);

// ----------------------------------
// TERRAIN
// ----------------------------------

function getTerrainHeight(x, z) {
  let y = Math.sin(x * 0.02) * Math.cos(z * 0.02) * 10;
  y += Math.sin(x * 0.05) * Math.cos(z * 0.05) * 3;
  return y;
}

const groundGeo = new THREE.PlaneGeometry(600, 600, 128, 128);
groundGeo.rotateX(-Math.PI / 2);
const pos = groundGeo.attributes.position;

for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const z = pos.getZ(i);
  pos.setY(i, getTerrainHeight(x, z));
}
groundGeo.computeVertexNormals();

const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x1f2b1a, roughness: 1 });
const ground = new THREE.Mesh(groundGeo, groundMaterial);
ground.receiveShadow = true;
scene.add(ground);

// ----------------------------------
// JUNGLE VEGETATION
// ----------------------------------

const trees = new THREE.Group();
scene.add(trees);

const barkMat = new THREE.MeshStandardMaterial({ color: 0x2e2214, roughness: 1 });
const leafMats = [
  new THREE.MeshStandardMaterial({ color: 0x112211, roughness: 0.9 }),
  new THREE.MeshStandardMaterial({ color: 0x1a331a, roughness: 0.9 }),
  new THREE.MeshStandardMaterial({ color: 0x0d1a0d, roughness: 0.9 })
];

function makeTree(x, z, scale = 1) {
  const tree = new THREE.Group();
  const trunkHeight = 15 + Math.random() * 15;
  
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1 * scale, 2.5 * scale, trunkHeight, 7), barkMat);
  trunk.position.y = trunkHeight / 2;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  tree.add(trunk);

  for (let i = 0; i < 12; i++) {
    const leaf = new THREE.Mesh(
      new THREE.DodecahedronGeometry((4 + Math.random() * 3) * scale, 1),
      leafMats[Math.floor(Math.random() * leafMats.length)]
    );
    leaf.position.set(
      (Math.random() - 0.5) * 8 * scale,
      trunkHeight + (Math.random() - 0.5) * 6 * scale,
      (Math.random() - 0.5) * 8 * scale
    );
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    tree.add(leaf);
  }

  for(let i=0; i<5; i++) {
    const vine = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 10+Math.random()*10, 4), leafMats[0]);
    vine.position.set((Math.random()-0.5)*5, trunkHeight - 5, (Math.random()-0.5)*5);
    vine.castShadow = true;
    tree.add(vine);
  }

  tree.position.set(x, getTerrainHeight(x, z), z);
  trees.add(tree);
}

for (let i = 0; i < 120; i++) {
  const x = (Math.random() - 0.5) * 280;
  const z = (Math.random() - 0.5) * 280;
  if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;
  makeTree(x, z, 0.8 + Math.random() * 1.5);
}

// ----------------------------------
// MIST PARTICLES
// ----------------------------------

const particleGeo = new THREE.BufferGeometry();
const particleCount = 1000;
const particlePos = new Float32Array(particleCount * 3);
for(let i=0; i<particleCount*3; i++) {
  particlePos[i] = (Math.random() - 0.5) * 200;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
const particleMat = new THREE.PointsMaterial({
  color: 0xaaccaa, size: 0.3, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ----------------------------------
// DINOSAURS (LOADING REAL MODELS)
// ----------------------------------

const loader = new GLTFLoader();
const dinosaurs = [];

// 1. Load a Velociraptor (Animated)
loader.load('https://raw.githubusercontent.com/trebeljahr/react-three-fiber-playground/main/public/glb/dinosaurs_pack/Velociraptor.glb', (gltf) => {
  const model = gltf.scene;
  model.scale.set(0.5, 0.5, 0.5); // Adjust scale
  model.traverse((child) => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
  
  // Create a group to move it around
  const raptorGroup = new THREE.Group();
  raptorGroup.add(model);
  raptorGroup.position.set(15, 0, -15);
  scene.add(raptorGroup);
  
  // Play animation
  const mixer = new THREE.AnimationMixer(model);
  const clip = gltf.animations.find(c => c.name.includes('Idle') || c.name.includes('Run'));
  if (clip) mixer.clipAction(clip).play();
  
  dinosaurs.push({ group: raptorGroup, mixer: mixer, speed: 2, radius: 20, angle: 0 });
});

// 2. Load a Triceratops (Animated)
loader.load('https://raw.githubusercontent.com/trebeljahr/react-three-fiber-playground/main/public/glb/dinosaurs_pack/Triceratops.glb', (gltf) => {
  const model = gltf.scene;
  model.scale.set(0.6, 0.6, 0.6);
  model.traverse((child) => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
  
  const triGroup = new THREE.Group();
  triGroup.add(model);
  triGroup.position.set(-25, 0, -30);
  scene.add(triGroup);
  
  const mixer = new THREE.AnimationMixer(model);
  const clip = gltf.animations.find(c => c.name.includes('Idle') || c.name.includes('Walk'));
  if (clip) mixer.clipAction(clip).play();
  
  dinosaurs.push({ group: triGroup, mixer: mixer, speed: 1.5, radius: 25, angle: Math.PI });
});

// 3. Load a T-Rex (Using a procedural fallback if the model fails)
// For simplicity and reliability, we create a large, menacing T-Rex using primitives
const tRexGroup = new THREE.Group();
const tRexBody = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 12), new THREE.MeshStandardMaterial({ color: 0x3a4a2a, roughness: 0.8 }));
tRexBody.scale.set(1.5, 1, 1);
tRexBody.position.y = 3;
tRexBody.castShadow = true;
tRexGroup.add(tRexBody);

const tRexHead = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 2.5), new THREE.MeshStandardMaterial({ color: 0x3a4a2a, roughness: 0.8 }));
tRexHead.position.set(0, 4.5, -2.5);
tRexHead.castShadow = true;
tRexGroup.add(tRexHead);

const tRexTail = new THREE.Mesh(new THREE.ConeGeometry(1, 4, 8), new THREE.MeshStandardMaterial({ color: 0x3a4a2a, roughness: 0.8 }));
tRexTail.position.set(0, 3, 3);
tRexTail.rotation.x = Math.PI / 2;
tRexTail.castShadow = true;
tRexGroup.add(tRexTail);

tRexGroup.position.set(0, 0, -20);
scene.add(tRexGroup);

// ----------------------------------
// CONTROLS
// ----------------------------------

let yaw = 0, pitch = 0;
const keys = {};
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

let joyX = 0, joyY = 0;
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
let joyActive = false;

joystick.addEventListener("pointerdown", e => {
  joyActive = true; joystick.setPointerCapture(e.pointerId); updateJoystick(e);
});
joystick.addEventListener("pointermove", e => { if (joyActive) updateJoystick(e); });

function updateJoystick(e) {
  const rect = joystick.getBoundingClientRect();
  let dx = e.clientX - rect.left - rect.width / 2;
  let dy = e.clientY - rect.top - rect.height / 2;
  const max = 40;
  const length = Math.hypot(dx, dy);
  if (length > max) { dx = dx / length * max; dy = dy / length * max; }
  joyX = dx / max; joyY = dy / max;
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
}

function releaseJoystick() {
  joyActive = false; joyX = 0; joyY = 0;
  stick.style.transform = "translate(0px, 0px)";
}
joystick.addEventListener("pointerup", releaseJoystick);
joystick.addEventListener("pointercancel", releaseJoystick);

let lookActive = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener("pointerdown", e => {
  lookActive = true; lastX = e.clientX; lastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove", e => {
  if (!lookActive) return;
  yaw -= (e.clientX - lastX) * 0.004;
  pitch -= (e.clientY - lastY) * 0.004;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
  lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener("pointerup", () => lookActive = false);
renderer.domElement.addEventListener("pointercancel", () => lookActive = false);

// ----------------------------------
// AUDIO & START
// ----------------------------------

const ambientAudio = document.getElementById("ambientSound");
const roarAudio = document.getElementById("roarSound");

document.getElementById("startButton").onclick = () => {
  document.getElementById("start").style.display = "none";
  
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }

  ambientAudio.volume = 0.5;
  ambientAudio.play().catch(e => console.log("Audio blocked:", e));
  
  // Dramatic roar after 3 seconds
  setTimeout(() => {
    roarAudio.volume = 0.8;
    roarAudio.play().catch(e => console.log("Audio blocked:", e));
  }, 3000);
};

// Random T-Rex roars
setInterval(() => {
  if(ambientAudio.paused) return;
  roarAudio.currentTime = 0;
  roarAudio.volume = 0.4 + Math.random() * 0.6;
  roarAudio.play().catch(e => {});
}, 20000);

// ----------------------------------
// ANIMATION LOOP
// ----------------------------------

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Movement
  let forward = 0, sideways = 0;
  if (keys["w"] || keys["arrowup"]) forward += 1;
  if (keys["s"] || keys["arrowdown"]) forward -= 1;
  if (keys["a"] || keys["arrowleft"]) sideways -= 1;
  if (keys["d"] || keys["arrowright"]) sideways += 1;
  forward -= joyY; sideways += joyX;

  const movement = new THREE.Vector3(sideways, 0, -forward);
  if (movement.length() > 1) movement.normalize();

  const direction = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const speed = 8;

  camera.position.addScaledVector(direction, movement.z * speed * delta);
  camera.position.addScaledVector(right, movement.x * speed * delta);

  // Terrain walking
  const terrainY = getTerrainHeight(camera.position.x, camera.position.z);
  camera.position.y = terrainY + 1.7;

  // Camera Bob
  if (movement.length() > 0) {
    camera.position.y += Math.sin(t * 15) * 0.06;
  }

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  // Animate Dinosaurs
  dinosaurs.forEach((dino, index) => {
    if (!dino.group) return;
    
    // Update animation
    if (dino.mixer) dino.mixer.update(delta);
    
    // Roaming logic
    dino.angle += delta * dino.speed * 0.2;
    const dinoX = Math.cos(dino.angle) * dino.radius;
    const dinoZ = Math.sin(dino.angle) * dino.radius;
    
    dino.group.position.set(dinoX, getTerrainHeight(dinoX, dinoZ), dinoZ);
    dino.group.rotation.y = -dino.angle + Math.PI / 2;
  });

  // Animate T-Rex (Procedural)
  if (tRexGroup) {
    // Make T-Rex circle the player menacingly
    const angle = t * 0.1;
    const radius = 30;
    const tx = Math.cos(angle) * radius;
    const tz = Math.sin(angle) * radius;
    
    tRexGroup.position.set(tx, getTerrainHeight(tx, tz), tz);
    
    // Make T-Rex face the player
    tRexGroup.lookAt(camera.position.x, tRexGroup.position.y, camera.position.z);
    
    // Add a slight head bob
    tRexHead.position.y = 4.5 + Math.sin(t * 2) * 0.2;
  }

  // Move mist particles
  particles.rotation.y = t * 0.01;

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
